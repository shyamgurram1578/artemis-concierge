<html lang="en">
<head>
<meta charset="UTF-8"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}
:root{--primary:#f5b731;--accent:#e0a020;--bg:#0c1a0d;--card:rgba(245,183,49,.04);--text:#fefce8}
.display-name{font-family:'Playfair Display',Georgia,serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s ease both}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 40%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--primary) 0%,transparent)}}
.pulse-card{animation:pulseBorder 2s ease-in-out infinite}
.no-sb::-webkit-scrollbar{display:none}
.no-sb{-ms-overflow-style:none;scrollbar-width:none}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-box{background:#1e293b;border-radius:18px;padding:36px;width:440px;border:1px solid #334155;position:relative;max-height:90vh;overflow-y:auto}

/* Dashboard */
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #1e2d1e}
.dash-row:last-child{border-bottom:none}
.dash-label{color:#94a3b8;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.dash-actions{display:flex;gap:10px;align-items:center}

/* Form inputs */
.f-input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px;color:#f8fafc;font-size:14px;outline:none;font-family:inherit;transition:border-color .2s}
.f-input:focus{border-color:var(--primary)}
.f-label{display:block;color:#94a3b8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.f-card{background:#1e293b;border-radius:12px;padding:18px;border:1px solid #334155}

/* Buttons */
.btn{border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn-primary{background:var(--primary);color:#1a1a1a}
.btn-ghost{background:rgba(255,255,255,.06);color:#94a3b8;border:1px solid #334155}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.btn-success{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.btn-upload{background:rgba(245,183,49,.12);color:var(--primary);border:1px solid rgba(245,183,49,.3);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}

/* Tabs */
.tab-strip{display:flex;border-bottom:1px solid #334155}
.tab-btn{padding:12px 22px;background:none;border:none;border-bottom:3px solid transparent;color:#64748b;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:color .2s}
.tab-btn.active{border-bottom-color:var(--primary);color:#f8fafc}

/* Table */
.data-table{width:100%;border-collapse:collapse}
.data-table th{background:#1e293b;color:#64748b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid #334155}
.data-table td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);color:#f8fafc;font-size:14px;vertical-align:middle}
.data-table tr:hover td{background:rgba(255,255,255,.02)}

/* Badge */
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.badge-green{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.badge-red{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.badge-amber{background:rgba(245,183,49,.12);color:#f5b731;border:1px solid rgba(245,183,49,.2)}

/* Alert */
.alert-warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:14px 16px;color:#fbbf24;font-size:13px;line-height:1.6}

/* Carousel fade */
@keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
</style>

  const user=DB.getUsers().find(u=>
    u.username.toLowerCase()===username.toLowerCase()&&

    u.active!==false

}

async function resizeImage(file,maxW=900,maxH=700,q=0.82){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(maxW/img.width,maxH/img.height,1);
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*scale);
        cv.height=Math.round(img.height*scale);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        resolve(cv.toDataURL("image/jpeg",q));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

function generateWaitlist(){
  const count=6+Math.floor(Math.random()*6);
  return NAMES.slice(0,count).map((name,i)=>({id:`g${i}`,name,size:SIZES[i],waitTime:BASE_WAITS[i]+Math.floor(Math.random()*5)}));
}

function applyTheme(primary,bg){
  const r=document.documentElement;
  r.style.setProperty("--primary",primary);
  r.style.setProperty("--accent",primary);
  r.style.setProperty("--bg",bg);
}

/* ═══════════════════ SHARED SUB-COMPONENTS ═══════════════════ */
function Modal({onClose,title,children,width=440}){
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal-box" style={{width}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <h2 style={{color:"#f8fafc",fontSize:20,fontWeight:800}}>{title}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:22,cursor:"pointer",lineHeight:1}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FileBtn({label,accept,onFile,style}){
  const ref=useRef();
  return(
    <>
      <input type="file" accept={accept||"image/*"} style={{display:"none"}} ref={ref}
        onChange={async e=>{const f=e.target.files[0];if(f)await onFile(f);e.target.value=""}}/>
      <button className="btn-upload" style={style} onClick={()=>ref.current.click()}>{label}</button>
    </>
  );
}

/* ═══════════════════ LOGIN MODAL ═══════════════════ */
function LoginModal({onClose,onUserLogin,onAdminLogin}){
  const [tab,setTab]=useState("user");
  const [form,setForm]=useState({username:"",password:""});
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const attempt=()=>{
    if(!form.username||!form.password){setErr("Please fill in all fields");return}
    setLoading(true);setTimeout(()=>{
      const role=tab==="user"?"owner":"admin";
      const user=doLogin(form.username,form.password,role);
      setLoading(false);
      if(user){setErr("");tab==="user"?onUserLogin(user):onAdminLogin(user)}
      else setErr("Invalid credentials or account inactive");
    },400);
  };

  return(
    <Modal onClose={onClose} title="Artemis Concierge">
      {/* Option cards */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
        {["user","admin"].map(t=>(
          <button key={t} onClick={()=>{setTab(t);setErr("")}} style={{
            padding:"16px 12px",borderRadius:12,border:`2px solid ${tab===t?"var(--primary)":"#334155"}`,
            background:tab===t?"rgba(245,183,49,.08)":"rgba(255,255,255,.02)",cursor:"pointer",
            color:tab===t?"var(--primary)":"#64748b",fontWeight:700,fontSize:13,fontFamily:"inherit",
            textAlign:"center",transition:"all .2s"
          }}>
            <div style={{fontSize:24,marginBottom:6}}>{t==="user"?"🏪":"🛡️"}</div>
            {t==="user"?"Restaurant Owner":"Admin Login"}
          </button>
        ))}
      </div>
      <div style={{marginBottom:14}}>
        <label className="f-label">{tab==="user"?"Owner":"Admin"} Username</label>
        <input className="f-input" value={form.username} autoFocus
          onChange={e=>setForm(f=>({...f,username:e.target.value}))}
          onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder={tab==="user"?"e.g. simplysouth":"admin"}/>
      </div>
      <div style={{marginBottom:err?10:20}}>
        <label className="f-label">Password</label>
        <input className="f-input" type="password" value={form.password}
          onChange={e=>setForm(f=>({...f,password:e.target.value}))}
          onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="Password"/>
      </div>
      {err&&<p style={{color:"#f87171",fontSize:13,marginBottom:14}}>{err}</p>}
      <button className="btn btn-primary" onClick={attempt} style={{width:"100%",padding:"13px"}} disabled={loading}>
        {loading?"Signing in…":"Sign In"}
      </button>
      {tab==="user"&&<p style={{color:"#475569",fontSize:12,textAlign:"center",marginTop:12}}>Demo: simplysouth / demo123</p>}
      {tab==="admin"&&<p style={{color:"#475569",fontSize:12,textAlign:"center",marginTop:12}}>Demo: admin / admin123</p>}
    </Modal>
  );
}

function AdminConsole({user,onBack,onLogout}){
  const [tab,setTab]=useState("users");
  const [users,setUsers]=useState(()=>DB.getUsers());
  const [restaurants,setRestaurants]=useState(()=>DB.getRestaurants());
  const [newUser,setNewUser]=useState({username:"",password:"",restaurantName:"",role:"owner"});
  const [gitForm,setGitForm]=useState({repo:"",token:"",branch:"main"});
  const [saved,setSaved]=useState(false);
  const [gitMsg,setGitMsg]=useState("");
  const [selRestaurant,setSelRestaurant]=useState(null);

  const showSaved=()=>{setSaved(true);setTimeout(()=>setSaved(false),2500)};

  const createUser=()=>{
    if(!newUser.username||!newUser.password)return;
    const uid=`u${Date.now()}`;
    const rid=`r${Date.now()}`;
    const newRest={id:rid,ownerId:uid,name:newUser.restaurantName||`${newUser.username}'s Restaurant`,...DEFAULT_RESTAURANT_TEMPLATE,specials:[...DEFAULT_SPECIALS.slice(0,3)]};
    const newU={id:uid,username:newUser.username,password:newUser.password,role:newUser.role,restaurantId:rid,active:true,createdAt:new Date().toISOString()};
    const updU=[...users,newU];const updR=[...restaurants,newRest];
    DB.saveUsers(updU);DB.saveRestaurants(updR);
    setUsers(updU);setRestaurants(updR);
    setNewUser({username:"",password:"",restaurantName:"",role:"owner"});
    showSaved();
  };

  const toggleUser=(id)=>{
    const updated=users.map(u=>u.id===id?{...u,active:!u.active}:u);
    DB.saveUsers(updated);setUsers(updated);showSaved();
  };

  const pushToGit=async()=>{
    if(!gitForm.repo||!gitForm.token){setGitMsg("⚠️ Repo and token required");return}
    setGitMsg("⏳ Pushing to GitHub…");
    try{
      const content=btoa(unescape(encodeURIComponent(document.documentElement.outerHTML)));
      const check=await fetch(`https://api.github.com/repos/${gitForm.repo}/contents/artemis-concierge.html`,{headers:{"Authorization":`token ${gitForm.token}`}});
      const sha=check.ok?(await check.json()).sha:undefined;
      const res=await fetch(`https://api.github.com/repos/${gitForm.repo}/contents/artemis-concierge.html`,{
        method:"PUT",headers:{"Authorization":`token ${gitForm.token}`,"Content-Type":"application/json"},
        body:JSON.stringify({message:"Update Artemis Concierge via admin console",content,branch:gitForm.branch,...(sha?{sha}:{})})
      });
      setGitMsg(res.ok?"✅ Pushed successfully to "+gitForm.repo:"❌ Push failed: "+res.status);
    }catch(e){setGitMsg("❌ Error: "+e.message)}
  };

  const updateRestaurantAdmin=(id,field,val)=>{
    const updated=restaurants.map(r=>r.id===id?{...r,[field]:val}:r);

        <button className="btn btn-ghost" style={{padding:"8px 14px",fontSize:13}} onClick={onLogout}>Sign Out</button>

      <div className="tab-strip" style={{padding:"0 28px",background:"#1e293b",flexShrink:0}}>

                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:selRestaurant===r.id?16:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:14}}>
                    {r.logoUrl&&<img src={r.logoUrl} alt="" style={{height:36,objectFit:"contain",borderRadius:6}} onError={e=>e.target.style.display="none"}/>}
                    <div>
                      <p style={{color:"#f8fafc",fontWeight:700,fontSize:15}}>{r.name}</p>
                      <p style={{color:"#64748b",fontSize:12}}>{r.tagline} · ID: {r.id}</p>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <div style={{width:10,height:10,borderRadius:"50%",background:r.active!==false?"#4ade80":"#f87171"}}/>
                    <span className={`badge ${r.active!==false?"badge-green":"badge-red"}`}>{r.active!==false?"Live":"Disabled"}</span>
                    <button className="btn btn-ghost" style={{fontSize:13,padding:"6px 14px"}}
                      onClick={()=>setSelRestaurant(selRestaurant===r.id?null:r.id)}>
                      {selRestaurant===r.id?"Collapse":"Edit"}
                    </button>
                    <button className={`btn ${r.active!==false?"btn-danger":"btn-success"}`} style={{fontSize:12,padding:"6px 12px"}}
                      onClick={()=>{updateRestaurantAdmin(r.id,"active",!(r.active!==false));setRestaurants(DB.getRestaurants())}}>
                      {r.active!==false?"Disable":"Enable"}
                    </button>
                  </div>
                </div>
                {selRestaurant===r.id&&(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginTop:4}}>
                    <div>
                      <label className="f-label">Restaurant Name</label>
                      <input className="f-input" defaultValue={r.name} style={{fontSize:13}}
                        onBlur={e=>updateRestaurantAdmin(r.id,"name",e.target.value)}/>
                    </div>
                    <div>
                      <label className="f-label">Tagline</label>
                      <input className="f-input" defaultValue={r.tagline} style={{fontSize:13}}
                        onBlur={e=>updateRestaurantAdmin(r.id,"tagline",e.target.value)}/>
                    </div>
                    <div>
                      <label className="f-label">Display URL</label>
                      <code style={{display:"block",background:"#0f172a",borderRadius:6,padding:"10px",color:"var(--primary)",fontSize:11}}>{window.location.href.split("?")[0]}?r={r.id}</code>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <div>
                        <label className="f-label">Accent Color</label>
                        <input type="color" value={r.primaryColor||"#f5b731"}
                          style={{width:48,height:36,borderRadius:6,border:"none",cursor:"pointer"}}
                          onChange={e=>updateRestaurantAdmin(r.id,"primaryColor",e.target.value)}/>
                      </div>
                      <div>
                        <label className="f-label">BG Color</label>
                        <input type="color" value={r.bgColor||"#0c1a0d"}
                          style={{width:48,height:36,borderRadius:6,border:"none",cursor:"pointer"}}
                          onChange={e=>updateRestaurantAdmin(r.id,"bgColor",e.target.value)}/>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {/* ── SYSTEM TAB ── */}
        {tab==="system"&&(
          <div style={{display:"flex",flexDirection:"column",gap:24}}>
            <h2 style={{color:"#f8fafc",fontSize:18,fontWeight:800}}>System Settings</h2>

            {/* Git push */}
            <div className="f-card">
              <p className="f-label" style={{marginBottom:14}}>Push to GitHub Repository</p>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:12,marginBottom:12}}>
                <div>
                  <label className="f-label">Repository (owner/repo)</label>
                  <input className="f-input" value={gitForm.repo} placeholder="yourusername/artemis-concierge"
                    onChange={e=>setGitForm(g=>({...g,repo:e.target.value}))}/>
                </div>
                <div>
                  <label className="f-label">Branch</label>
                  <input className="f-input" value={gitForm.branch} onChange={e=>setGitForm(g=>({...g,branch:e.target.value}))}/>
                </div>
              </div>
              <div style={{marginBottom:14}}>
                <label className="f-label">GitHub Personal Access Token</label>
                <input className="f-input" type="password" value={gitForm.token} placeholder="ghp_••••••••••••••••"
                  onChange={e=>setGitForm(g=>({...g,token:e.target.value}))}/>
              </div>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <button className="btn btn-primary" onClick={pushToGit}>⬆ Push Current App to GitHub</button>
                {gitMsg&&<span style={{color:gitMsg.startsWith("✅")?"#4ade80":gitMsg.startsWith("⏳")?"#f5b731":"#f87171",fontSize:13}}>{gitMsg}</span>}
              </div>
              <p style={{color:"#475569",fontSize:12,marginTop:10}}>Pushes the entire Artemis Concierge HTML to your GitHub repo. Requires a Personal Access Token with repo write permission.</p>
            </div>

            {/* Stats */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>
              {[
                {label:"Total Restaurants",value:restaurants.length,color:"#f5b731"},
                {label:"Active Owners",value:users.filter(u=>u.role==="owner"&&u.active!==false).length,color:"#4ade80"},
                {label:"Disabled Accounts",value:users.filter(u=>u.active===false).length,color:"#f87171"},
                {label:"System Version",value:"v2.0",color:"#a78bfa"},
              ].map(s=>(
                <div key={s.label} className="f-card" style={{textAlign:"center"}}>
                  <p style={{color:s.color,fontSize:32,fontWeight:900}}>{s.value}</p>
                  <p style={{color:"#64748b",fontSize:12,marginTop:4}}>{s.label}</p>
                </div>
              ))}
            </div>

            {/* Reset */}
            <div className="f-card">
              <p className="f-label" style={{marginBottom:10}}>Danger Zone</p>
              <button className="btn btn-danger" style={{fontSize:13}} onClick={()=>{
                if(confirm("Reset ALL data to factory defaults? This cannot be undone.")){
                  localStorage.removeItem("artemis_users");localStorage.removeItem("artemis_restaurants");
                  location.reload();
                }
              }}>⚠ Reset All Data to Factory Defaults</button>
            </div>
          </div>
        )}
      </div>
      <SaveToast show={saved}/>
    </div>
  );
}

/* ═══════════════════ LOBBY DISPLAY ═══════════════════ */
function SpecialsCarousel({specials}){
  const [idx,setIdx]=useState(0);
  const [vis,setVis]=useState(true);
  const validSpecials=specials.filter(s=>s.imageUrl||s.itemName);
  if(!validSpecials.length)return(
    <section style={{border:"3px solid var(--primary)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.02)"}}>
      <div style={{textAlign:"center",color:"rgba(255,255,255,.3)"}}>
        <div style={{fontSize:48,marginBottom:12}}>🍽️</div>
        <p style={{fontSize:"clamp(14px,2vw,20px)"}}>Today's Specials Coming Soon</p>
      </div>
    </section>
  );
  useEffect(()=>{if(validSpecials.length<2)return;const t=setInterval(()=>{setVis(false);setTimeout(()=>{setIdx(p=>(p+1)%validSpecials.length);setVis(true)},700)},10000);return()=>clearInterval(t)},[validSpecials.length]);
  const sp=validSpecials[idx%validSpecials.length];
  return(
    <section style={{border:"3px solid var(--primary)",borderRadius:18,overflow:"hidden",position:"relative",background:"#000"}}>
      <div style={{position:"absolute",inset:0,opacity:vis?1:0,transition:"opacity .7s ease"}}>
        {sp.imageUrl&&<img src={sp.imageUrl} alt={sp.itemName} style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>}
      </div>
      <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.1) 55%,transparent 100%)",display:"flex",flexDirection:"column",justifyContent:"flex-end",padding:"clamp(16px,3vh,36px)",opacity:vis?1:0,transition:"opacity .7s ease"}}>
        <p style={{color:"var(--primary)",fontSize:"clamp(11px,1.4vw,18px)",fontWeight:700,letterSpacing:3,textTransform:"uppercase",marginBottom:6}}>Today's Special</p>
        <p style={{color:"#fff",fontSize:"clamp(26px,4.5vw,64px)",fontWeight:900,lineHeight:1.05,marginBottom:6}}>{sp.itemName}</p>
        <p style={{color:"#cbd5e1",fontSize:"clamp(13px,1.8vw,24px)",marginBottom:10,lineHeight:1.4}}>{sp.caption}</p>
        {sp.price&&<p style={{color:"var(--primary)",fontSize:"clamp(22px,3.5vw,50px)",fontWeight:800}}>{sp.price}</p>}
      </div>
      <div style={{position:"absolute",bottom:18,right:20,display:"flex",gap:8,zIndex:10}}>
        {validSpecials.map((_,i)=>(
          <div key={i} onClick={()=>{setVis(false);setTimeout(()=>{setIdx(i);setVis(true)},300)}}
            style={{width:i===idx?24:8,height:8,borderRadius:9999,background:i===idx?"var(--primary)":"rgba(255,255,255,.4)",cursor:"pointer",transition:"all .3s"}}/>
        ))}
      </div>
    </section>
  );
}

function WaitlistPanel({data}){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t)},[]);
  const guests=data?.nextInLine??[];
  return(
    <section style={{border:"3px solid var(--primary)",borderRadius:18,padding:"clamp(14px,2.5vh,32px)",background:"var(--card)",display:"flex",flexDirection:"column",gap:"clamp(10px,1.8vh,22px)",overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",borderBottom:"1px solid rgba(255,255,255,.1)",paddingBottom:"clamp(10px,1.5vh,18px)"}}>
        <div><p style={{color:"rgba(255,255,255,.45)",fontSize:"clamp(10px,1.1vw,15px)",letterSpacing:1,textTransform:"uppercase"}}>Guests Waiting</p><p style={{color:"#fff",fontSize:"clamp(32px,5.5vw,72px)",fontWeight:900,lineHeight:1}}>{data?.totalWaiting??0}</p></div>
        <div style={{textAlign:"right"}}><p style={{color:"rgba(255,255,255,.45)",fontSize:"clamp(10px,1.1vw,15px)",textTransform:"uppercase",letterSpacing:1}}>Est. Wait</p><p style={{color:"#fff",fontSize:"clamp(32px,5.5vw,72px)",fontWeight:900,lineHeight:1}}>{data?.avgWait??0}<span style={{fontSize:".4em",color:"rgba(255,255,255,.5)"}}>m</span></p></div>
        <div style={{textAlign:"right"}}><p style={{color:"rgba(255,255,255,.4)",fontSize:"clamp(10px,1.2vw,16px)",textTransform:"uppercase",letterSpacing:1}}>{now.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</p><p style={{color:"var(--primary)",fontSize:"clamp(18px,2.5vw,34px)",fontWeight:700}}>{now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}</p></div>
      </div>
      <p style={{color:"rgba(255,255,255,.4)",fontSize:"clamp(10px,1.2vw,15px)",fontWeight:700,letterSpacing:3,textTransform:"uppercase"}}>Next in Line</p>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:"clamp(7px,1.2vh,14px)"}} className="no-sb">
        {guests.map((g,i)=>(
          <div key={g.id} className={i===0?"pulse-card fade-up":"fade-up"}
            style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:i===0?"clamp(12px,2vh,20px) clamp(14px,2vw,24px)":"clamp(8px,1.3vh,14px) clamp(14px,2vw,24px)",borderRadius:12,border:i===0?"3px solid var(--primary)":"1px solid rgba(255,255,255,.08)",background:i===0?"color-mix(in srgb,var(--primary) 14%,transparent)":"rgba(255,255,255,.02)",animationDelay:`${i*60}ms`}}>
            <div style={{display:"flex",alignItems:"center",gap:"clamp(10px,1.5vw,20px)"}}>
              <div style={{width:i===0?"clamp(36px,4.5vw,56px)":"clamp(28px,3.5vw,44px)",height:i===0?"clamp(36px,4.5vw,56px)":"clamp(28px,3.5vw,44px)",borderRadius:"50%",background:i===0?"var(--primary)":"rgba(255,255,255,.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:i===0?"clamp(14px,2vw,24px)":"clamp(11px,1.5vw,18px)",fontWeight:800,color:i===0?"#1a1a1a":"#fff",flexShrink:0}}>{i+1}</div>
              <div>
                <p style={{color:"#fff",fontSize:i===0?"clamp(22px,3.8vw,54px)":"clamp(15px,2.5vw,34px)",fontWeight:i===0?900:600,lineHeight:1.1}}>{g.name}</p>
                {i===0&&<p style={{color:"var(--primary)",fontSize:"clamp(10px,1.2vw,15px)",fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>✦ NEXT UP</p>}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <p style={{color:i===0?"#fff":"rgba(255,255,255,.55)",fontSize:i===0?"clamp(18px,2.8vw,40px)":"clamp(13px,2vw,28px)",fontWeight:700}}>👥 {g.size}</p>
              <p style={{color:"rgba(255,255,255,.35)",fontSize:"clamp(9px,1vw,14px)"}}>~{g.waitTime}m</p>
            </div>
          </div>
        ))}
        {!guests.length&&<p style={{color:"rgba(255,255,255,.3)",fontSize:"clamp(14px,2vw,20px)",textAlign:"center",marginTop:32}}>No guests currently waiting</p>}
      </div>
      <p style={{color:"rgba(255,255,255,.2)",fontSize:"clamp(9px,1vw,13px)",textAlign:"center",letterSpacing:1}}>Auto-updates every 30s · Artemis Concierge</p>
    </section>
  );
}

function LobbyDisplay({restaurantId,onOpenLogin}){
  const [restaurant,setRestaurant]=useState(()=>{
    const r=DB.getRestaurant(restaurantId);
    return r||DEFAULT_RESTAURANTS[0];
  });
  const [data,setData]=useState(null);

  useEffect(()=>{
    const r=DB.getRestaurant(restaurantId)||DEFAULT_RESTAURANTS[0];
    setRestaurant(r);
    applyTheme(r.primaryColor||"#f5b731",r.bgColor||"#0c1a0d");
  },[restaurantId]);

  const refresh=useCallback(async()=>{
    // Re-read restaurant data in case owner updated it
    const r=DB.getRestaurant(restaurantId);
    if(r){setRestaurant(r);applyTheme(r.primaryColor,r.bgColor)}

    const creds=(r||restaurant).toastCreds||{};
    const {clientId,clientSecret,locationId}=creds;

    // Use live Toast API if credentials are present, otherwise fall back to mock
    if(clientId&&clientSecret&&locationId){
      try{
        const params=new URLSearchParams({clientId,clientSecret,locationId});
        const res=await fetch(`/api/toast-waitlist?${params}`);
        if(res.ok){
          const json=await res.json();
          setData(json);
          return;
        }
      }catch(e){
        console.warn("Toast API error, falling back to mock:",e);
      }
    }
    // Mock fallback
    const wl=generateWaitlist();
    setData({totalWaiting:wl.length,avgWait:wl[0]?.waitTime??0,nextInLine:wl.slice(0,6),source:"mock"});
  },[restaurantId]);

  useEffect(()=>{refresh();const t=setInterval(refresh,30000);return()=>clearInterval(t)},[refresh]);

  const sw=restaurant.layout?.specialsWidth||50;

  return(
    <div style={{width:"100vw",height:"100vh",background:"var(--bg)",display:"grid",gridTemplateRows:`${restaurant.layout?.headerHeight||18}vh 1fr`,gap:"clamp(8px,1.5vh,16px)",padding:"clamp(8px,1.5vh,16px)",overflow:"hidden",cursor:"none"}}>
      <header style={{border:"3px solid var(--primary)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 clamp(20px,4vw,56px)",background:"rgba(255,255,255,.02)",overflow:"hidden"}}>
        <div style={{overflow:"hidden"}}>
          <p style={{color:"var(--primary)",fontSize:"clamp(10px,1vw,14px)",textTransform:"uppercase",letterSpacing:4,fontWeight:700}}>Welcome to</p>
          <p className="display-name" style={{color:"#fff",fontSize:"clamp(26px,4.5vw,62px)",fontWeight:700,whiteSpace:"nowrap",lineHeight:1.05,fontStyle:"italic"}}>{restaurant.name}</p>
          <p style={{color:"rgba(255,255,255,.5)",fontSize:"clamp(9px,1.1vw,15px)",letterSpacing:3,fontWeight:600,textTransform:"uppercase"}}>{restaurant.tagline||"Pure Indian Vegetarian"}</p>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          {restaurant.logoUrl&&<img src={restaurant.logoUrl} alt={restaurant.name} style={{height:"clamp(36px,8vh,76px)",objectFit:"contain",borderRadius:8}} onError={e=>e.target.style.display="none"}/>}
          <button onClick={onOpenLogin} title="Admin / Owner Login"
            style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",color:"rgba(255,255,255,.2)",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:16}}>⚙</button>
        </div>
      </header>
      <div style={{display:"grid",gridTemplateColumns:`${sw}% 1fr`,gap:"clamp(8px,1.5vw,16px)",minHeight:0}}>
        <SpecialsCarousel specials={restaurant.specials?.filter(s=>s?.imageUrl||s?.itemName)||DEFAULT_SPECIALS}/>
        <WaitlistPanel data={data}/>
      </div>
    </div>
  );
}

/* ═══════════════════ ROOT APP ═══════════════════ */
function App(){
  const urlR=new URLSearchParams(window.location.search).get("r")||"r1";
  const [view,setView]=useState("lobby");
  const [showLogin,setShowLogin]=useState(false);
  const [currentUser,setCurrentUser]=useState(null);
  const [restaurantId,setRestaurantId]=useState(urlR);

  useEffect(()=>{
    const r=DB.getRestaurant(restaurantId)||DEFAULT_RESTAURANTS[0];
    applyTheme(r.primaryColor||"#f5b731",r.bgColor||"#0c1a0d");
    document.title=`${r.name} — Artemis Concierge`;
  },[restaurantId]);

  const logout=()=>{setCurrentUser(null);setView("lobby");setShowLogin(false)};

  if(view==="owner")return<OwnerDashboard user={currentUser} onBack={()=>setView("lobby")} onLogout={logout}/>;
  if(view==="admin")return<AdminConsole user={currentUser} onBack={()=>setView("lobby")} onLogout={logout}/>;

  return(
    <>
      <LobbyDisplay restaurantId={restaurantId} onOpenLogin={()=>setShowLogin(true)}/>
      {showLogin&&(
        <LoginModal
          onClose={()=>setShowLogin(false)}
          onUserLogin={u=>{setCurrentUser(u);setRestaurantId(u.restaurantId||restaurantId);setShowLogin(false);setView("owner")}}
          onAdminLogin={u=>{setCurrentUser(u);setShowLogin(false);setView("admin")}}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
